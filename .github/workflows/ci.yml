name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --locked --extra dev --no-install-project
      - name: Lint
        run: uv run --no-sync ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --locked --extra dev --no-install-project
      - name: Type check
        run: uv run --no-sync mypy main.py config.py logger.py pipeline/ scrapers/ db/ notifiers/ --ignore-missing-imports

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --no-install-project
          uv pip install pip-audit
      - name: Security scan
        run: uv run --no-sync bandit -r . -x tests/,.venv/ -ll
      - name: Audit dependencies for known vulnerabilities
        run: uv run --no-sync pip-audit

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --locked --extra dev --no-install-project
      - name: Run tests with coverage
        run: uv run --no-sync python -m pytest tests/ -v --cov --cov-report=term-missing --cov-fail-under=70
