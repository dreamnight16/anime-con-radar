name: Daily Scrape

on:
  schedule:
    - cron: "0 2 * * *"  # UTC 02:00 daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv sync --locked --no-install-project
          uv run --no-sync playwright install chromium

      - name: Run scraper
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BILI_BUVID3: ${{ secrets.BILI_BUVID3 }}
          BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}
          BILI_BILI_JCT: ${{ secrets.BILI_BILI_JCT }}
          DAMAI_COOKIE2: ${{ secrets.DAMAI_COOKIE2 }}
          DAMAI_M_H5_TK: ${{ secrets.DAMAI_M_H5_TK }}
          DAMAI_APP_KEY: ${{ secrets.DAMAI_APP_KEY }}
        run: uv run --no-sync python main.py run

      - name: Publish events data for web
        run: |
          mkdir -p web/src/data
          cp events.json web/src/data/events.json

      - name: Commit web events data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update web events data'
          file_pattern: 'web/src/data/events.json'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Upload events as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: events-data
          path: |
            events.json
            events.db
            comiradar.log
          retention-days: 7
